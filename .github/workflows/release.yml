name: Release

# On every merge to main: run CI, then, unless pubspec.yaml's version is tagged already, tag it
# (the tag is the bare version, 1.2.3, matching the {{version}} tag pattern set on pub.dev) and
# start publish.yml on that tag. A merge that doesn't change the version releases nothing.
#
# Needs no secret: the tag is pushed with GITHUB_TOKEN. Such a push doesn't start other
# workflows, so publish.yml is started explicitly with workflow_dispatch, which pub.dev accepts
# from a tag ref.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Tag and publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
      actions: write # start publish.yml
    steps:
      - uses: actions/checkout@v5

      - name: Read the version
        id: version
        run: |
          .github/scripts/check_version.sh
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '"'"'"' \r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$version is already tagged: nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the tag
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "galva_flutter $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Start publish.yml on the tag
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "refs/tags/$VERSION"
          echo "Tagged $VERSION and started publish.yml, which uploads it to pub.dev." >> "$GITHUB_STEP_SUMMARY"
