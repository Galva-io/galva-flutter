name: Publish to pub.dev

# pub.dev accepts automated uploads only from a tag ref matching the tag pattern set on the
# package's admin page ({{version}}, so the tag is the bare version: 1.2.3). release.yml starts
# this workflow on the tag it pushes after a merge to main (workflow_dispatch); a tag pushed by
# hand starts it too (push).

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

env:
  # Pinned so a new Flutter release can't break a merge to main, which releases. Raise it on
  # purpose, in ci.yml and publish.yml together.
  FLUTTER_VERSION: "3.50.0"

permissions:
  contents: read

jobs:
  publish:
    # Run from a branch, the upload would be refused by pub.dev anyway.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Matches "Require GitHub Actions environment" on pub.dev. GitHub creates the environment on
    # the first run; a repository admin can add protection rules (reviewers, tag filter) to it.
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # pub.dev authenticates the upload with the workflow's OIDC token
    steps:
      - uses: actions/checkout@v5
      # Fetches the OIDC token and registers it for pub.dev; flutter pub reads the same token.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: The tag matches pubspec.yaml
        run: .github/scripts/check_version.sh "$GITHUB_REF_NAME"
      - name: Is the version on pub.dev already?
        id: published
        run: |
          if curl -sf -o /dev/null "https://pub.dev/api/packages/galva_flutter/versions/$GITHUB_REF_NAME"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is already on pub.dev (uploaded by hand?): nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.exists == 'false'
        run: flutter pub get
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        run: flutter pub publish --force
