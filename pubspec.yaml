name: galva_flutter
description: Galva SDK for Flutter. Identify subscribers, track events, and show Galva's in-app messages, push notifications and offer links in iOS and Android apps.
version: 1.0.0
homepage: https://galva.io
repository: https://github.com/Galva-io/galva-flutter
issue_tracker: https://github.com/Galva-io/galva-flutter/issues
documentation: https://docs.galva.io

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.galva.flutter
        pluginClass: GalvaFlutterPlugin
      ios:
        pluginClass: GalvaFlutterPlugin
